name: doge_trading
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10.12
  - numpy=1.24.3
  - ta-lib  
  - pip
  - pip:
    # 核心计算库
    - polars==0.20.7
    - pyarrow==14.0.1
    - numba==0.58.1
    - pandas==2.1.4
    # 机器学习
    - lightgbm>=4.1.0
    - scikit-learn==1.3.2
    # 异步与网络
