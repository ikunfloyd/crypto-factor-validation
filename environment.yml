    - psutil==5.9.6
    - pyyaml==6.0.1
    - loguru==0.7.2
    - rich==13.7.0
    # 测试工具
    - pytest==7.4.3
    - pytest-asyncio==0.21.1
    - pytest-cov==4.1.0
    - pytest-timeout==2.2.0