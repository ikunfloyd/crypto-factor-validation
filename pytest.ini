[pytest]
# pytest配置文件

# 测试目录
testpaths = tests

# Python文件模式
python_files = test_*.py

# Python类模式
python_classes = Test*

# Python函数模式
python_functions = test_*

# 输出选项
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# 标记定义
markers =
    slow: 慢速测试
    integration: 集成测试
    unit: 单元测试

# 最小Python版本
minversion = 6.0

# 日志配置
log_cli = false
log_cli_level = INFO
log_file = tests/test.log
log_file_level = DEBUG

# 覆盖率配置（如果使用pytest-cov）
# [coverage:run]
# source = .
# omit = tests/*,*/__pycache__/*
