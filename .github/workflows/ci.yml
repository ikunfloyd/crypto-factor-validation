name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # The demo runs first: it trains the synthetic expert models, and the
      # test that loads real models is skipped when none exist yet.
      - name: Smoke-test the offline demo (trains synthetic models end-to-end)
        run: python scripts/demo.py --candles 500

      - name: Run tests
        run: pytest -q
